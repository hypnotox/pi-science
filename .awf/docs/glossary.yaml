data:
  terms:
    - term: analysis scenario
      meaning: A named treatment of model variables as fixed values, bounds, finite choices, definitions, or retained scaling dimensions.
    - term: candidate comparison
      meaning: Python and Pi analysis of exactly two mapped formulations under shared mathematical metadata; scenarios are not compared, and work conclusions use qualified aggregate abstract-work evidence.
    - term: conservative bound
      meaning: A qualified limit guaranteed by stated assumptions when an exact range cannot be derived.
    - term: dominant term
      meaning: A canonical aggregate-work term with greatest absolute magnitude within an active declared domain; it implies neither scenario control nor growth control.
    - term: equation system
      meaning: Named indexed equations whose domains and references define aggregate work and dependencies.
    - term: mathematical request
      meaning: A restricted-SymPy computation with relevant domains, assumptions, scenarios, and primitive costs.
    - term: normalized interpretation
      meaning: The canonical mathematical form the analyzer actually uses, returned in SymPy and LaTeX renderings for inspection.
    - term: opaque primitive
      meaning: A symbolic function whose internal work remains unknown until the request supplies a definition or cost.
    - term: primitive cost
      meaning: A symbolic abstract-work expression assigned to an otherwise opaque operation.
    - term: scaling variable
      meaning: A variable retained as an asymptotic dimension rather than fixed by a scenario.
    - term: symbolic work
      meaning: An expression counting abstract computation while preserving declared parameters and unknown primitive costs.
    - term: unresolved quantity
      meaning: A result the analyzer cannot tighten without additional syntax, assumptions, domains, definitions, or costs.
