[project]
name = "py-science-formula"
version = "0.1.1"
description = "Deterministic symbolic formula analysis for coding agents"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.12,<3",
  "sympy>=1.14,<2",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_science"]
