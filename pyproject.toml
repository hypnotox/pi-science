[project]
name = "pi-science-workspace"
version = "0.2.0"
description = "Development workspace for pi-science packages"
requires-python = ">=3.13,<3.14"
dependencies = ["py-science-formula"]

[tool.uv.sources]
py-science-formula = { workspace = true }

[dependency-groups]
dev = [
  "pyright>=1.1.408,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.uv.workspace]
members = ["packages/py-science-formula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["packages/py-science-formula/src", "packages/pi-science/bridge", "tests"]
extraPaths = ["packages/py-science-formula/src"]
pythonVersion = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
