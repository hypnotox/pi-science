name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: npm ci
      - run: ./awf render
      - run: ./scripts/check
      - run: ./scripts/check-release
